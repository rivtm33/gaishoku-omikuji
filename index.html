<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜祭りの外食おみくじ｜家族会議</title>
<style>
:root{
  --night1:#0b1230; --night2:#1b2454; --night3:#2b1d3f;
  --gold:#f5c542; --gold2:#c9971f; --red:#d8443c; --red2:#8f221d;
  --paper:#f7efdd; --ink:#2a2216; --sub:#a99a86;
  --panel:rgba(255,255,255,.055); --line:rgba(245,197,66,.35);
  --wood:linear-gradient(180deg,#f0dcb8 0%,#dcc094 55%,#b8945f 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  padding:0 14px 70px;color:var(--paper);
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  line-height:1.6;
  background:
    radial-gradient(120% 70% at 50% -10%, #3a2a5c 0%, transparent 60%),
    radial-gradient(90% 60% at 85% 110%, #4a2438 0%, transparent 55%),
    linear-gradient(180deg,var(--night1) 0%, var(--night2) 45%, var(--night3) 100%);
  background-attachment:fixed;
  min-height:100vh;
}
/* 星 */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
#stars i{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1.15)}}
.wrap{max-width:940px;margin:0 auto;position:relative;z-index:1}

/* ---- 提灯 ---- */
.lanterns{position:relative;height:74px;margin:0 -14px 2px}
.rope{position:absolute;top:14px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#6b5636 8%,#6b5636 92%,transparent)}
.lanterns .lt{position:absolute;top:16px;transform-origin:top center;animation:sway 4s ease-in-out infinite}
.lt .cord{width:2px;height:9px;background:#6b5636;margin:0 auto}
.lt .body{
  width:30px;height:40px;border-radius:50%/44%;
  background:radial-gradient(circle at 32% 30%, #ffd98a, #e0534a 55%, #a52a25 100%);
  box-shadow:0 0 18px rgba(255,150,90,.55), inset 0 -6px 10px rgba(0,0,0,.25);
  position:relative;display:grid;place-items:center;
  font-size:15px;color:#fff6dd;font-weight:bold;text-shadow:0 1px 2px rgba(0,0,0,.4)
}
.lt .body::before,.lt .body::after{
  content:"";position:absolute;left:6px;right:6px;height:4px;background:#f0c05a;border-radius:2px}
.lt .body::before{top:-2px}.lt .body::after{bottom:-2px}
.lt .tassel{width:3px;height:9px;background:#f0c05a;margin:2px auto 0;border-radius:2px}
@keyframes sway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}

/* ---- 見出し ---- */
h1{
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
  font-size:27px;text-align:center;margin:4px 0 2px;color:var(--gold);
  letter-spacing:.12em;text-shadow:0 0 18px rgba(245,197,66,.35)
}
h1 small{display:block;font-size:12px;color:#cbbba1;font-weight:normal;letter-spacing:0;margin-top:6px;
  font-family:inherit}
.step{
  display:flex;align-items:center;gap:9px;margin:26px 0 10px;font-weight:bold;font-size:15.5px;
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;letter-spacing:.06em;color:#ffeec4
}
.step i{
  width:26px;height:26px;border-radius:50%;flex:0 0 auto;font-style:normal;font-size:13px;
  display:grid;place-items:center;color:#2a1206;font-family:sans-serif;font-weight:bold;
  background:radial-gradient(circle at 35% 30%,#ffe38a,var(--gold) 60%,var(--gold2));
  box-shadow:0 0 12px rgba(245,197,66,.5)
}

/* ---- メンバー ---- */
.members{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.member{
  border:1.5px solid var(--line);background:var(--panel);border-radius:999px;
  padding:8px 14px;font-size:15px;font-weight:bold;cursor:pointer;color:var(--paper);
  display:flex;align-items:center;gap:6px;transition:.15s;backdrop-filter:blur(3px)
}
.member .cnt{font-size:11px;background:rgba(255,255,255,.12);color:#d9caae;border-radius:999px;padding:1px 8px}
.member.on{
  border-color:var(--gold);color:#2a1206;
  background:linear-gradient(180deg,#ffe9a8,var(--gold));
  box-shadow:0 0 18px rgba(245,197,66,.45)
}
.member.on .cnt{background:rgba(0,0,0,.22);color:#fff5d8}
.hint{text-align:center;font-size:12.5px;color:#b6a68e;margin:9px 0 0}

/* ---- 店カード ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:11px;margin-top:12px}
.shop{
  position:relative;border-radius:14px;padding:11px 12px 12px;cursor:pointer;transition:.15s;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
  border:1.5px solid rgba(255,255,255,.13);backdrop-filter:blur(4px);overflow:hidden
}
.shop:active{transform:scale(.98)}
.shop.voted{
  border-color:var(--gold);
  background:linear-gradient(180deg,rgba(245,197,66,.20),rgba(245,197,66,.06));
  box-shadow:0 0 20px rgba(245,197,66,.22)
}
.shop .top{display:flex;align-items:center;gap:9px}
.shop .emo{font-size:27px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.shop .nm{font-weight:bold;font-size:16.5px}
.shop .genre{font-size:11.5px;color:#b6a68e}
.shop .meta{font-size:12px;color:#c3b39a;margin-top:7px}
.shop .pt{font-size:12px;margin-top:4px;color:#cabca6}
.badge{
  position:absolute;top:0;right:0;font-size:11px;font-weight:bold;padding:3px 9px;
  border-bottom-left-radius:11px;color:#2a1206;
  background:linear-gradient(180deg,#ffe9a8,var(--gold))
}
/* 票→くじ */
.kuji{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;min-height:26px;align-items:flex-end}
.kuji .empty{font-size:11.5px;color:#8e8069}
.tag{
  display:flex;align-items:center;gap:4px;font-size:11px;font-weight:bold;
  background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:999px;padding:2px 8px 2px 3px;
  color:#ffeec4
}
.tag .mini{width:7px;height:16px;border-radius:3px;background:var(--wood);border:.5px solid #8a6a3a;flex:0 0 auto}
.tag .mini::after{content:"";display:block;height:4px;border-radius:3px 3px 0 0}

/* ---- くじ筒の中身 ---- */
.box{
  margin-top:12px;border-radius:16px;padding:14px 14px 16px;
  background:linear-gradient(180deg,rgba(0,0,0,.34),rgba(0,0,0,.18));
  border:1.5px dashed var(--line)
}
.boxhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.boxhead .t{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:16px;color:#ffeec4;letter-spacing:.06em}
.boxhead .n{font-size:13px;color:#b6a68e}
.boxhead .n b{color:var(--gold);font-size:20px;font-family:"Yu Mincho",serif;margin:0 2px}
.bundles{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
.bundle{text-align:center;min-width:66px}
.rack{display:flex;gap:3px;justify-content:center;align-items:flex-end;height:64px}
.stick{
  width:11px;height:56px;border-radius:4px;background:var(--wood);
  border:1px solid rgba(120,90,45,.7);position:relative;
  box-shadow:0 2px 5px rgba(0,0,0,.45), inset -2px 0 3px rgba(0,0,0,.12);
  animation:grow .3s cubic-bezier(.2,1.6,.4,1)
}
.stick::before{content:"";position:absolute;left:0;right:0;top:0;height:11px;border-radius:3px 3px 0 0;background:var(--c,#d8443c)}
.stick::after{content:"";position:absolute;left:2.5px;right:2.5px;top:20px;height:1.5px;background:rgba(120,90,45,.45);
  box-shadow:0 5px 0 rgba(120,90,45,.45),0 10px 0 rgba(120,90,45,.45)}
@keyframes grow{from{transform:translateY(14px) scaleY(.3);opacity:0}to{transform:none;opacity:1}}
.bundle .lb{font-size:11.5px;margin-top:6px;color:#d6c7ad;line-height:1.35}
.bundle .lb b{display:block;color:var(--gold);font-size:12.5px}
.boxempty{font-size:13px;color:#9a8c76;text-align:center;padding:16px 0}

/* ---- ボタン ---- */
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
button.act{
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:bold;font-size:19px;
  letter-spacing:.14em;border:none;border-radius:999px;padding:15px 38px;cursor:pointer;
  color:#2a1206;background:linear-gradient(180deg,#ffe9a8 0%,var(--gold) 55%,var(--gold2) 100%);
  box-shadow:0 5px 0 #8a6410, 0 0 26px rgba(245,197,66,.45);transition:.1s
}
button.act:active{transform:translateY(4px);box-shadow:0 1px 0 #8a6410,0 0 18px rgba(245,197,66,.4)}
button.sub{
  font-family:inherit;font-size:13px;border:1.5px solid var(--line);background:var(--panel);
  color:#e2d5bd;border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:bold
}

/* ---- 確率 ---- */
.odds{display:none;margin-top:14px}
.odds.show{display:block}
.oddsrow{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:6px 0}
.oddsrow .l{width:104px;flex:0 0 auto;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d6c7ad}
.bar{flex:1;height:12px;background:rgba(0,0,0,.4);border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .4s}
.oddsrow .r{width:82px;flex:0 0 auto;color:var(--gold);font-weight:bold;font-size:12px}

/* ---- 抽選ステージ ---- */
.stage{display:none;text-align:center;margin-top:16px;border-radius:20px;padding:24px 14px 26px;
  background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.22));border:1.5px solid var(--line)}
.stage.show{display:block}
.tubearea{position:relative;height:210px;display:grid;place-items:end center}
.fan{position:absolute;bottom:74px;left:50%;width:0;height:0}
.fan .fs{position:absolute;bottom:0;left:-5.5px;width:11px;height:74px;transform-origin:bottom center;
  border-radius:4px;background:var(--wood);border:1px solid rgba(120,90,45,.7);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.fan .fs::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;border-radius:3px 3px 0 0;background:var(--c,#d8443c)}
.tube{
  position:relative;width:104px;height:112px;border-radius:12px 12px 16px 16px;
  background:linear-gradient(90deg,#7a1f1a 0%,#c0392f 22%,#e06a56 42%,#c0392f 68%,#6d1b16 100%);
  box-shadow:0 10px 26px rgba(0,0,0,.5), inset 0 -10px 16px rgba(0,0,0,.3);
  border:2px solid #f0c05a;display:grid;place-items:center;z-index:2
}
.tube .kanji{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:29px;color:#ffeec4;
  writing-mode:vertical-rl;letter-spacing:.1em;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.shaking{animation:shake .32s infinite}
@keyframes shake{
  0%,100%{transform:rotate(-9deg) translate(0,0)}
  25%{transform:rotate(8deg) translate(4px,-7px)}
  50%{transform:rotate(-6deg) translate(-4px,3px)}
  75%{transform:rotate(9deg) translate(3px,-5px)}
}
.rolling{font-size:24px;font-weight:bold;margin-top:14px;min-height:36px;color:#ffeec4;letter-spacing:.05em}
.counting{font-size:12.5px;color:#b6a68e;margin-top:2px}

.result{display:none;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.result.show{display:block}
@keyframes pop{from{transform:scale(.35) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.slip{
  max-width:430px;margin:0 auto;background:linear-gradient(180deg,#fdf6e6,#f0e3c6);
  color:var(--ink);border-radius:6px;padding:20px 20px 22px;position:relative;
  box-shadow:0 14px 40px rgba(0,0,0,.55);border:1px solid #d8c79c
}
.slip::before,.slip::after{content:"";position:absolute;left:10px;right:10px;height:3px;background:var(--red)}
.slip::before{top:8px}.slip::after{bottom:8px}
.slip .kichi{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:34px;font-weight:bold;
  color:var(--red2);letter-spacing:.34em;margin:6px 0 2px;text-indent:.34em}
.slip .emo{font-size:62px;line-height:1.15;margin:2px 0}
.slip .nm{font-size:30px;font-weight:bold;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;letter-spacing:.05em}
.slip .det{font-size:13px;color:#6b5c45;margin-top:8px;white-space:pre-line}
.slip hr{border:none;border-top:1px dashed #c9b58f;margin:14px 0}
.slip .why{font-size:12.8px;text-align:left;color:#4d4032;line-height:1.85}
.slip .why b{color:var(--red2)}
.hit{background:#ffe9a8;border-radius:4px;padding:1px 5px;font-weight:bold}

.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.conf i{position:absolute;width:9px;height:15px;opacity:0;animation:fall 2.6s linear forwards}
@keyframes fall{0%{opacity:1;transform:translateY(-40px) rotate(0)}100%{opacity:0;transform:translateY(106vh) rotate(760deg)}}
footer{text-align:center;font-size:11px;color:#8e8069;margin-top:36px}
</style>
</head>
<body>
<div id="stars"></div>

<div class="wrap">
  <div class="lanterns" id="lanterns"><div class="rope"></div></div>

  <h1>夜祭り 外食おみくじ
    <small>投票した票の数だけ、くじが筒に入ります 🎋</small>
  </h1>

  <div class="step"><i>1</i>だれが投票する？</div>
  <div class="members" id="members"></div>
  <p class="hint">名前を選んでから、お店をタップ。<b>何店でも選べます</b>（選ぶたびにくじが1本増える）</p>

  <div class="step"><i>2</i>行きたいお店をタップ ＝ くじを1本入れる</div>
  <div class="grid" id="grid"></div>

  <div class="step"><i>3</i>くじ筒の中身</div>
  <div class="box">
    <div class="boxhead">
      <div class="t">🎋 筒の中のくじ</div>
      <div class="n">ぜんぶで <b id="total">0</b> 本</div>
    </div>
    <div class="bundles" id="bundles"></div>
  </div>

  <div class="btnrow">
    <button class="act" id="draw">くじを引く</button>
  </div>
  <div class="btnrow" style="margin-top:10px">
    <button class="sub" id="toggleOdds">当たる確率を見る</button>
    <button class="sub" id="reset">投票をリセット</button>
  </div>
  <div class="odds" id="odds"></div>

  <div class="stage" id="stage">
    <div id="anim">
      <div class="tubearea">
        <div id="shaker" style="position:relative;display:grid;place-items:end center;height:200px">
          <div class="fan" id="fan"></div>
          <div class="tube"><div class="kanji">御神籤</div></div>
        </div>
      </div>
      <div class="rolling" id="rolling">ガラガラ…</div>
      <div class="counting" id="counting"></div>
    </div>

    <div class="result" id="result">
      <div class="slip">
        <div class="kichi" id="kichi">大吉</div>
        <div class="emo" id="rEmo">🍔</div>
        <div class="nm" id="rName">マクドナルド</div>
        <div class="det" id="rDet"></div>
        <hr>
        <div class="why" id="rWhy"></div>
      </div>
      <div class="btnrow">
        <button class="sub" id="again">もう一度引く</button>
        <button class="sub" id="back">投票にもどる</button>
      </div>
    </div>
  </div>

  <footer>※価格帯は目安です。店舗や地域によって異なる場合があります。</footer>
</div>
<div class="conf" id="conf"></div>

<script>
/* ============ データ（外食選択肢一覧表より） ============ */
const SHOPS = [
  {id:"mac",  emo:"🍔", c:"#d8443c", name:"マクドナルド",   genre:"ハンバーガー",       budget:"¥500〜800",    price:1, kids:"キッズメニューあり（おもちゃ付き）", pt:"手軽で早い／新商品が楽しい／ドライブスルーも便利", when:"サクッと済ませたい時"},
  {id:"kappa",emo:"🍣", c:"#e0762f", name:"かっぱ寿司",     genre:"回転寿司",           budget:"¥800〜1,200",  price:2, kids:"お子さまメニューあり（デザート付き）", pt:"ネタの種類が豊富／フェアメニューが充実", when:"いろいろ食べたい時"},
  {id:"hama", emo:"🍤", c:"#2f6fd0", name:"はま寿司",       genre:"回転寿司",           budget:"¥800〜1,200",  price:2, kids:"はまっこセットあり（おもちゃ付き）", pt:"110円皿が中心／タッチパネルで簡単／期間限定が豊富", when:"コスパよくお寿司を楽しみたい時"},
  {id:"kura", emo:"🎁", c:"#6b4bbd", name:"くら寿司",       genre:"回転寿司",           budget:"¥900〜1,300",  price:2, kids:"ビッくらポン！でおもちゃがもらえる", pt:"ビッくらポン！でワクワク／無添加へのこだわり", when:"子どもと一緒に楽しみたい時"},
  {id:"ohsho",emo:"🥟", c:"#c0392f", name:"餃子の王将",     genre:"中華料理",           budget:"¥800〜1,200",  price:2, kids:"お子さまメニューあり（ラーメン・ごはんなど）", pt:"餃子が人気！ボリューム満点／お持ち帰りもできる", when:"しっかり食べたい時"},
  {id:"saize",emo:"🍝", c:"#3f9455", name:"サイゼリヤ",     genre:"イタリアン",         budget:"¥600〜1,000",  price:1, kids:"小学生以下のキッズメニューあり", pt:"リーズナブルでコスパ◎／メニューが豊富", when:"安くてゆっくり食事をしたい時"},
  {id:"bami", emo:"🍜", c:"#d94f7a", name:"バーミヤン",     genre:"中華レストラン",     budget:"¥800〜1,200",  price:2, kids:"キッズメニューあり（ラーメン・デザートなど）", pt:"本格中華が楽しめる／ラーメンや炒飯が人気", when:"中華をゆっくり楽しみたい時"},
  {id:"cocos",emo:"🍳", c:"#e0a92f", name:"ココス",         genre:"ファミリーレストラン", budget:"¥800〜1,300", price:2, kids:"おこさまメニューあり（ドリンクバー付きも）", pt:"ハンバーグやステーキが人気／デザートが豊富", when:"家族でゆっくり食事を楽しみたい時"},
  {id:"goemo",emo:"🍽️", c:"#3aa8a0", name:"洋麺屋五右衛門", genre:"パスタ",             budget:"¥1,000〜1,500",price:3, kids:"キッズプレートあり（ドリンク付き）", pt:"和風パスタが特徴／おしゃれな雰囲気", when:"ちょっと特別な食事をしたい時"},
  {id:"sukes",emo:"🍲", c:"#8a6a3a", name:"資さんうどん",   genre:"うどん",             budget:"¥700〜1,100",  price:2, kids:"お子さまうどんセットあり", pt:"北九州発の人気うどん店／ボリューム満点", when:"うどんが食べたい時"},
  {id:"azuma",emo:"🥢", c:"#5c6f8a", name:"生そばあずま",   genre:"そば",               budget:"¥800〜1,200",  price:2, kids:"お子さまメニューあり（うどん・そばなど）", pt:"本格的な生そば／天ぷらや丼セットも人気", when:"そばをゆっくり味わいたい時"}
];
const MEMBERS = [
  {id:"papa",  name:"パパ",      emo:"👨"},
  {id:"mama",  name:"ママ",      emo:"👩"},
  {id:"achan", name:"あーちゃん", emo:"🧒"},
  {id:"kaori", name:"かおり",    emo:"👧"},
  {id:"asahi", name:"あさひ",    emo:"👦"}
];
const KICHI = ["大吉","中吉","小吉","末吉","家族吉","満腹吉"];

/* ============ 夜空 & 提灯 ============ */
(function(){
  const st = document.getElementById("stars");
  for(let i=0;i<70;i++){
    const s = document.createElement("i");
    const sz = Math.random()*2 + 1;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}vw;top:${Math.random()*72}vh;
      animation-delay:${(Math.random()*3).toFixed(2)}s`;
    st.appendChild(s);
  }
  const box = document.getElementById("lanterns");
  const chars = "夜祭外食籤家族選";
  const n = 9;
  for(let i=0;i<n;i++){
    const d = document.createElement("div");
    d.className = "lt";
    d.style.left = (4 + i*(92/(n-1))) + "%";
    d.style.animationDelay = (i*0.28).toFixed(2)+"s";
    d.innerHTML = `<div class="cord"></div><div class="body">${chars[i%chars.length]}</div><div class="tassel"></div>`;
    box.appendChild(d);
  }
})();

/* ============ 状態 ============ */
const KEY = "gaishoku-omikuji-v2";
let votes = {};
let current = MEMBERS[0].id;
SHOPS.forEach(s => votes[s.id] = []);

function save(){ localStorage.setItem(KEY, JSON.stringify({d:new Date().toDateString(), v:votes})); }
function load(){
  try{
    const o = JSON.parse(localStorage.getItem(KEY));
    if(o && o.d === new Date().toDateString() && o.v)
      SHOPS.forEach(s => { if(Array.isArray(o.v[s.id])) votes[s.id] = o.v[s.id]; });
  }catch(e){}
}

const $ = id => document.getElementById(id);
const shopOf = id => SHOPS.find(s => s.id === id);
const memberOf = id => MEMBERS.find(m => m.id === id);
const countOf = mid => SHOPS.reduce((n,s) => n + (votes[s.id].includes(mid) ? 1 : 0), 0);
const totalVotes = () => SHOPS.reduce((n,s) => n + votes[s.id].length, 0);

/* ============ 描画 ============ */
function renderMembers(){
  $("members").innerHTML = MEMBERS.map(m => `
    <div class="member ${m.id===current?'on':''}" data-m="${m.id}">
      <span>${m.emo}</span><span>${m.name}</span><span class="cnt">くじ${countOf(m.id)}本</span>
    </div>`).join("");
}

function renderShops(){
  $("grid").innerHTML = SHOPS.map(s => {
    const v = votes[s.id];
    const tags = v.length
      ? v.map(id => { const m = memberOf(id);
          return `<span class="tag"><span class="mini" style="--c:${s.c}"></span>${m.emo}${m.name}</span>`; }).join("")
      : `<span class="empty">くじ 0本</span>`;
    return `<div class="shop ${v.includes(current)?'voted':''}" data-s="${s.id}">
      ${v.length ? `<div class="badge">くじ ${v.length}本</div>` : ""}
      <div class="top">
        <div class="emo">${s.emo}</div>
        <div><div class="nm">${s.name}</div><div class="genre">${s.genre}</div></div>
      </div>
      <div class="meta">${s.budget}／1人　${"★".repeat(s.price)}${"☆".repeat(3-s.price)}</div>
      <div class="pt">${s.pt}</div>
      <div class="kuji">${tags}</div>
    </div>`;
  }).join("");
}

/* 筒の中身：1票＝1本の棒を実際に並べる */
function renderBundles(){
  const total = totalVotes();
  $("total").textContent = total;
  const box = $("bundles");
  if(total === 0){
    box.innerHTML = `<div class="boxempty">まだ1本も入っていません。<br>
      お店をタップするとここにくじが増えます（そのまま引くと全11店から均等に抽選）</div>`;
    return;
  }
  box.innerHTML = SHOPS.filter(s => votes[s.id].length)
    .sort((a,b) => votes[b.id].length - votes[a.id].length)
    .map(s => {
      const n = votes[s.id].length;
      const sticks = Array.from({length:n},() => `<div class="stick" style="--c:${s.c}"></div>`).join("");
      return `<div class="bundle">
        <div class="rack">${sticks}</div>
        <div class="lb"><b>${s.emo}${s.name}</b>${n}本 / ${total}本<br>${(n/total*100).toFixed(0)}%</div>
      </div>`;
    }).join("");
}

function renderOdds(){
  const total = totalVotes();
  const denom = total === 0 ? SHOPS.length : total;
  const list = SHOPS.map(s => ({s, n: total===0 ? 1 : votes[s.id].length}))
    .filter(x => x.n > 0).sort((a,b) => b.n - a.n);
  $("odds").innerHTML =
    `<div class="hint" style="margin-bottom:8px">${
      total === 0 ? "0本なので、全11店が同じ確率です" : `くじ 全${total}本 のうち何本あるか＝当たる確率`}</div>` +
    list.map(x => `<div class="oddsrow">
        <div class="l">${x.s.emo}${x.s.name}</div>
        <div class="bar"><span style="width:${x.n/denom*100}%"></span></div>
        <div class="r">${x.n}/${denom}本 ${(x.n/denom*100).toFixed(0)}%</div>
      </div>`).join("");
}

function renderAll(){ renderMembers(); renderShops(); renderBundles(); renderOdds(); save(); }

/* ============ 操作 ============ */
$("members").addEventListener("click", e => {
  const el = e.target.closest("[data-m]"); if(!el) return;
  current = el.dataset.m; renderAll();
});
$("grid").addEventListener("click", e => {
  const el = e.target.closest("[data-s]"); if(!el) return;
  const arr = votes[el.dataset.s], i = arr.indexOf(current);
  if(i >= 0) arr.splice(i,1); else arr.push(current);
  renderAll();
});
$("reset").addEventListener("click", () => {
  if(!confirm("くじを全部出して、投票をリセットします。よろしいですか？")) return;
  SHOPS.forEach(s => votes[s.id] = []); renderAll();
});
$("toggleOdds").addEventListener("click", () => {
  const o = $("odds"); o.classList.toggle("show");
  $("toggleOdds").textContent = o.classList.contains("show") ? "確率を閉じる" : "当たる確率を見る";
});

/* ============ 抽選 ============ */
function buildTickets(){
  const t = [];
  SHOPS.forEach(s => { for(let i=0;i<votes[s.id].length;i++) t.push(s.id); });
  return t.length ? t : SHOPS.map(s => s.id);
}
function pick(tickets){
  const a = new Uint32Array(1); crypto.getRandomValues(a);
  return tickets[a[0] % tickets.length];
}

/* 筒から扇状に飛び出すくじ＝チケット1本1本 */
function renderFan(tickets){
  const fan = $("fan");
  const view = tickets.slice(0, 28);
  const spread = Math.min(74, 9 * view.length);
  fan.innerHTML = view.map((id,i) => {
    const deg = view.length === 1 ? 0 : -spread/2 + spread * i/(view.length-1);
    return `<div class="fs" style="--c:${shopOf(id).c};transform:rotate(${deg.toFixed(1)}deg)"></div>`;
  }).join("");
}

let rollTimer = null;
function drawLots(){
  clearTimeout(rollTimer);
  const tickets = buildTickets();
  const winnerId = pick(tickets);
  const winner = shopOf(winnerId);
  const total = tickets.length;
  const n = tickets.filter(t => t === winnerId).length;

  $("stage").classList.add("show");
  $("anim").style.display = "block";
  $("result").classList.remove("show");
  renderFan(tickets);
  $("shaker").classList.add("shaking");
  $("counting").textContent = `筒の中は 全${total}本`;
  $("stage").scrollIntoView({behavior:"smooth", block:"center"});

  let delay = 60, elapsed = 0;
  const roll = () => {
    const s = shopOf(tickets[Math.floor(Math.random()*tickets.length)]);
    $("rolling").textContent = s.emo + " " + s.name;
    elapsed += delay;
    if(elapsed > 1500) delay *= 1.28;
    if(delay < 340) rollTimer = setTimeout(roll, delay);
    else finish(winner, n, total);
  };
  roll();
}

function finish(w, n, total){
  $("shaker").classList.remove("shaking");
  $("anim").style.display = "none";
  $("kichi").textContent = KICHI[Math.floor(Math.random()*KICHI.length)];
  $("rEmo").textContent = w.emo;
  $("rName").textContent = w.name;
  $("rDet").textContent = `${w.genre}／${w.budget}（1人あたり）\n${"★".repeat(w.price)}${"☆".repeat(3-w.price)}　${w.when}`;
  const voters = votes[w.id].map(id => { const m = memberOf(id); return m.emo + m.name; }).join("・")
    || "（投票なし・全11店から均等に抽選）";
  $("rWhy").innerHTML =
    `<b>くじを入れた人：</b>${voters}<br>` +
    `<b>引き当てた確率：</b>全${total}本のうち <span class="hit">${n}本</span> ＝ ${(n/total*100).toFixed(1)}%<br>` +
    `<b>おすすめ：</b>${w.pt}<br>` +
    `<b>子ども向け：</b>${w.kids}`;
  $("result").classList.add("show");
  confetti();
}

function confetti(){
  const c = $("conf"), cols = ["#f5c542","#d8443c","#fff3d0","#e0762f","#6b4bbd"];
  for(let i=0;i<80;i++){
    const s = document.createElement("i");
    s.style.left = Math.random()*100 + "vw";
    s.style.background = cols[i % cols.length];
    s.style.animationDelay = (Math.random()*.7) + "s";
    s.style.animationDuration = (1.9 + Math.random()*1.4) + "s";
    c.appendChild(s);
    setTimeout(() => s.remove(), 4200);
  }
}

$("draw").addEventListener("click", drawLots);
$("again").addEventListener("click", drawLots);
$("back").addEventListener("click", () => {
  clearTimeout(rollTimer);
  $("stage").classList.remove("show");
  $("bundles").scrollIntoView({behavior:"smooth", block:"center"});
});

load(); renderAll();
</script>
</body>
</html>
